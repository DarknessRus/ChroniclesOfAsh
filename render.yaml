services:
  - type: web
    name: chronicles-of-ash-ai
    runtime: node
    rootDir: ai-server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    plan: free
    envVars:
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
      - key: AI_API_URL
        value: https://openrouter.ai/api/v1/chat/completions
