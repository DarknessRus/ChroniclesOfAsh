name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  export-apk:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Configure Android export environment
        shell: bash
        run: |
          set -eux
          godot --version

          # Godot 4.3 Android export preset targets SDK 34; the base image only
          # installs API 33, which causes the export preset validation to fail.
          export ANDROID_HOME="/usr/lib/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          # sdkmanager may close stdin after checking licenses; avoid SIGPIPE failing the whole step.
          (yes | sdkmanager --licenses >/dev/null) || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

          # Make the export templates visible under the HOME used by GitHub Actions.
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          cp /root/.local/share/godot/export_templates/4.3.stable/android_debug.apk "$HOME/.local/share/godot/export_templates/4.3.stable/"
          cp /root/.local/share/godot/export_templates/4.3.stable/android_release.apk "$HOME/.local/share/godot/export_templates/4.3.stable/"

          JAVA_BIN="$(command -v javac)"
          JAVA_HOME_DIR="$(dirname "$(dirname "$(readlink -f "$JAVA_BIN")")")"
          test -x "$JAVA_HOME_DIR/bin/java"

          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME_DIR"
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

          # Explicitly configure the debug signing key in the Android export preset.
          # Use awk because the Godot CI container does not include Python.
          awk -v home="$HOME" '
            $0 == "[preset.0.options]" {
              print
              print "keystore/debug=\"" home "/.android/debug.keystore\""
              print "keystore/debug_user=\"androiddebugkey\""
              print "keystore/debug_password=\"android\""
              next
            }
            { print }
          ' export_presets.cfg > export_presets.cfg.tmp
          mv export_presets.cfg.tmp export_presets.cfg

          test -f "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"
          test -f "$HOME/.local/share/godot/export_templates/4.3.stable/android_release.apk"
          cat export_presets.cfg

      - name: Import and validate Godot project
        run: godot --headless --editor --path . --quit

      - name: Export Android APK
        run: |
          set -eux
          export ANDROID_HOME="/usr/lib/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "Installed Android SDK packages:"
          sdkmanager --list_installed || true
          echo "Build-tools directories:"
          ls -la /usr/lib/android-sdk/build-tools
          echo "Platform directories:"
          ls -la /usr/lib/android-sdk/platforms
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/ChroniclesOfAsh.apk 2>&1 | tee build/export.log
          test -s build/ChroniclesOfAsh.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChroniclesOfAsh-Android-APK
          path: build/ChroniclesOfAsh.apk
          if-no-files-found: error
          retention-days: 14
