name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  export-apk:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Configure Android export environment
        shell: bash
        run: |
          set -eux
          godot --version

          # Install the exact Android SDK components documented for Godot 4.3.
          # The container image ships a newer NDK, which can fail preset validation.
          export ANDROID_HOME="/usr/lib/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          # sdkmanager may close stdin after checking licenses; avoid SIGPIPE failing the whole step.
          (yes | sdkmanager --licenses >/dev/null) || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;23.2.8568313"

          # Make the export templates visible under the HOME used by GitHub Actions.
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          cp /root/.local/share/godot/export_templates/4.3.stable/android_debug.apk "$HOME/.local/share/godot/export_templates/4.3.stable/"
          cp /root/.local/share/godot/export_templates/4.3.stable/android_release.apk "$HOME/.local/share/godot/export_templates/4.3.stable/"

          JAVA_BIN="$(command -v javac)"
          JAVA_HOME_DIR="$(dirname "$(dirname "$(readlink -f "$JAVA_BIN")")")"
          test -x "$JAVA_HOME_DIR/bin/java"

          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME_DIR"
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/ndk_path = "/usr/lib/android-sdk/ndk/23.2.8568313"
          export/android/cmake_path = "/usr/lib/android-sdk/cmake/3.10.2.4988404"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

          # Explicitly configure the debug signing key in the Android export preset.
          # Use awk because the Godot CI container does not include Python.
          awk -v home="$HOME" '
            $0 == "[preset.0.options]" {
              print
              print "keystore/debug=\"" home "/.android/debug.keystore\""
              print "keystore/debug_user=\"androiddebugkey\""
              print "keystore/debug_password=\"android\""
              next
            }
            { print }
          ' export_presets.cfg > export_presets.cfg.tmp
          mv export_presets.cfg.tmp export_presets.cfg

          test -f "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"
          test -f "$HOME/.local/share/godot/export_templates/4.3.stable/android_release.apk"
          cat export_presets.cfg

      - name: Download free CC0 fantasy character assets
        shell: bash
        run: |
          set -u
          mkdir -p assets/free/rpg_characters /tmp/rpg-character-pack
          apt-get update -qq
          apt-get install -y -qq python3 python3-pip python3-venv
          python3 -m venv /tmp/gdown-venv
          /tmp/gdown-venv/bin/pip install --quiet gdown
          if /tmp/gdown-venv/bin/gdown --folder "https://drive.google.com/drive/folders/1MIRQXLfTd21HMI5rwOb6Xy0rv0xv1m8b" -O /tmp/rpg-character-pack; then
            find /tmp/rpg-character-pack -type f -iname '*.zip' -print0 | while IFS= read -r -d '' archive; do
              unzip -oq "$archive" -d /tmp/rpg-character-pack/unpacked || true
            done
            find /tmp/rpg-character-pack -type f \( -iname '*.fbx' -o -iname '*.glb' -o -iname '*.gltf' -o -iname '*.obj' -o -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.tga' -o -iname '*.mtl' -o -iname '*.bin' \) -not -path '*/.git/*' -exec cp --parents '{}' assets/free/rpg_characters/ \;
            echo "Imported source files:"
            find assets/free/rpg_characters -type f | head -80
          else
            echo "::warning::The public CC0 character pack could not be downloaded; continuing with built-in fallback art."
          fi

      - name: Download free CC0 nature models
        shell: bash
        run: |
          set -eux
          apt-get update -qq
          apt-get install -y -qq curl unzip
          mkdir -p assets/free/nature
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://store.godotengine.org/asset/quaternius/stylized-nature-megakit/download/31/" \
            --output /tmp/stylized-nature.zip
          unzip -oq /tmp/stylized-nature.zip -d assets/free/nature
          echo "Nature asset inventory:"
          find assets/free/nature -type f \( -iname '*.glb' -o -iname '*.gltf' -o -iname '*.fbx' -o -iname '*.obj' \) | sed -n '1,100p'
          test "$(find assets/free/nature -type f \( -iname '*.glb' -o -iname '*.gltf' -o -iname '*.fbx' -o -iname '*.obj' \) | wc -l)" -gt 0

      - name: Import and validate Godot project
        run: godot --headless --editor --path . --quit

      - name: Export Android APK
        shell: bash
        run: |
          set -eux
          export ANDROID_HOME="/usr/lib/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "Installed Android SDK packages:"
          sdkmanager --list_installed || true
          echo "Build-tools directories:"
          ls -la /usr/lib/android-sdk/build-tools
          echo "Platform directories:"
          ls -la /usr/lib/android-sdk/platforms
          mkdir -p build
          set -o pipefail
          godot --headless --verbose --path . --export-debug "Android" build/ChroniclesOfAsh.apk 2>&1 | tee build/export.log
          test -s build/ChroniclesOfAsh.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChroniclesOfAsh-Android-APK
          path: build/ChroniclesOfAsh.apk
          if-no-files-found: error
          retention-days: 14
