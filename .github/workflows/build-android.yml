name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  export-apk:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Configure Android export environment
        shell: bash
        run: |
          set -eux
          godot --version

          # Make the export templates visible under the HOME used by GitHub Actions.
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          cp /root/.local/share/godot/export_templates/4.3.stable/android_debug.apk "$HOME/.local/share/godot/export_templates/4.3.stable/"
          cp /root/.local/share/godot/export_templates/4.3.stable/android_release.apk "$HOME/.local/share/godot/export_templates/4.3.stable/"

          JAVA_BIN="$(command -v javac)"
          JAVA_HOME_DIR="$(dirname "$(dirname "$(readlink -f "$JAVA_BIN")")")"
          test -x "$JAVA_HOME_DIR/bin/java"

          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME_DIR"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

          # Explicitly configure the debug signing key in the Android export preset.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("export_presets.cfg")
          s = p.read_text()
          marker = 'package/signed=true'
          replacement = '\n'.join([
              'package/signed=true',
              'package/keystore/debug="' + str(Path.home() / ".android/debug.keystore") + '"',
              'package/keystore/debug_user="androiddebugkey"',
              'package/keystore/debug_password="android"',
          ])
          if marker not in s:
              raise SystemExit("Could not find package/signed in export_presets.cfg")
          p.write_text(s.replace(marker, replacement, 1))
          PY

          test -f "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"
          test -f "$HOME/.local/share/godot/export_templates/4.3.stable/android_release.apk"
          cat export_presets.cfg

      - name: Import and validate Godot project
        run: godot --headless --editor --path . --quit

      - name: Export Android APK
        run: |
          set -eux
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/ChroniclesOfAsh.apk
          test -s build/ChroniclesOfAsh.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChroniclesOfAsh-Android-APK
          path: build/ChroniclesOfAsh.apk
          if-no-files-found: error
          retention-days: 14
