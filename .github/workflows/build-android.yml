name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  export-apk:
    runs-on: ubuntu-latest
    container:
      # The published barichello/godot-ci tag for Godot 4.3 is "4.3".
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Check Godot and Android export templates
        run: |
          godot --version
          test -f /root/.local/share/godot/export_templates/4.3.stable/android_debug.apk
          test -f /root/.local/share/godot/export_templates/4.3.stable/android_release.apk
      - name: Import and validate Godot project
        run: godot --headless --editor --path . --quit
      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/ChroniclesOfAsh.apk
          test -s build/ChroniclesOfAsh.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChroniclesOfAsh-Android-APK
          path: build/ChroniclesOfAsh.apk
          if-no-files-found: error
          retention-days: 14
