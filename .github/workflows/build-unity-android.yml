name: Build Unity Android APK

# Generated contour textures are created during CI; keep the build running and allow those generated files.
concurrency:
  group: unity-android-${{ github.ref }}
  # Do not mark earlier runs as cancelled when a newer commit arrives.
  cancel-in-progress: false
on:
  workflow_dispatch:
  push:
    paths:
      - 'Unity/**'
      - 'tools/**'
      - '.github/workflows/build-unity-android.yml'
jobs:
  build:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    name: Unity Android build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Download CC0 environment models and companion maps
        run: python .github/scripts/download_environment_models.py
      - name: Download official CC0 animated knight model
        run: |
          python -m pip install "gdown==5.2.0"
          python tools/build_skeletal_hero.py
      - name: Download CC0 PBR texture maps
        run: python tools/download_pbr_textures.py
      - name: Generate pixel-based hero contour textures
        run: |
          python -m pip install --upgrade pip
          python -m pip install "rembg[cpu]==2.0.67" "opencv-python-headless==4.10.0.84" "Pillow>=10,<12"
          python tools/generate_hero_contours.py
      - name: Verify reference artwork and high-detail world textures
        run: python tools/verify_build_assets.py
      - name: Check Unity secrets
        run: |
          test -n "${{ secrets.UNITY_LICENSE }}" || (echo "Missing UNITY_LICENSE secret. Add Unity Personal license XML in repository Actions secrets." && exit 1)
          test -n "${{ secrets.UNITY_EMAIL }}" || (echo "Missing UNITY_EMAIL secret." && exit 1)
          test -n "${{ secrets.UNITY_PASSWORD }}" || (echo "Missing UNITY_PASSWORD secret." && exit 1)
      - name: Raise file descriptor limit for Unity worker
        shell: bash
        run: |
          set -euxo pipefail
          # The limit must be raised on the runner worker before the Unity action
          # starts; changing only this short-lived shell does not affect its parent.
          worker_pid="$(pgrep -f 'Runner.Worker' | head -n 1)"
          if [ -z "$worker_pid" ]; then
            echo "Could not locate GitHub Actions Runner.Worker process."
            exit 1
          fi
          sudo prlimit --pid "$worker_pid" --nofile=1048576:1048576
          sudo prlimit --pid "$worker_pid" --nofile
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Unity
          targetPlatform: Android
          unityVersion: 2022.3.62f1
          buildName: ChroniclesOfAsh
          buildsPath: build
          allowDirtyBuild: true
      - name: Verify APK was rebuilt and has a plausible size
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find build/Android -maxdepth 1 -type f -name '*.apk' -print)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "Expected exactly one APK, found ${#apks[@]}."
            printf '%s\\n' "${apks[@]}"
            exit 1
          fi
          apk="${apks[0]}"
          size=$(stat -c '%s' "$apk")
          echo "Fresh APK: $apk"
          echo "APK size: $size bytes"
          if [ "$size" -lt 20000000 ]; then
            echo "APK is under 20 MB; refusing to publish a likely incomplete build."
            exit 1
          fi
          sha256sum "$apk"
      - uses: actions/upload-artifact@v4
        with:
          name: ChroniclesOfAsh-Unity-APK
          path: build/Android/*.apk
          if-no-files-found: error
